spring:
  application:
    name: EmailAutomata
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/emailautomata?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:emailautomata}
    password: ${DB_PASSWORD:emailautomata}
    hikari:
      pool-name: emailautomata-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    # Hibernate never mutates the schema. Flyway is the single source of truth;
    # validate fails fast at startup if entities and migrations disagree.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

emailautomata:
  api-version: v1
  build-version: @project.version@
  cors:
    allowed-origins:
      - http://localhost:5173
  jwt:
    # Dev-only fallback. Production supplies JWT_SECRET; the app refuses to
    # start if it is shorter than 32 bytes, which HS256 requires.
    secret: ${JWT_SECRET:emailautomata-local-development-secret-key-change-me}
    issuer: emailautomata
    expiry-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.emailautomata: INFO