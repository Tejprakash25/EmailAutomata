spring:
  application:
    name: EmailAutomata
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/emailautomata?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:emailautomata}
    password: ${DB_PASSWORD:emailautomata}
    hikari:
      pool-name: emailautomata-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

emailautomata:
  api-version: v1
  build-version: @project.version@
  cors:
    allowed-origins:
      - http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:emailautomata-local-development-secret-key-change-me}
    issuer: emailautomata
    expiry-minutes: 720
  mail:
    from-address: ${MAIL_FROM:no-reply@emailautomata.local}
    from-name: ${MAIL_FROM_NAME:EmailAutomata}
    # Selects the active transport. 'log' (default) writes each message to the
    # log and needs no SMTP server. Set MAIL_TRANSPORT=smtp for real delivery.
    transport: ${MAIL_TRANSPORT:log}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.emailautomata: INFO